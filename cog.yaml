# Clean Screenshot OCR with EasyOCR
# Production-ready Cog deployment

build:
  gpu: false
  cog_runtime: true
  python_version: "3.11"
  
  python_requirements: requirements.txt
  
  # Install CPU PyTorch for local testing; on GPU (Replicate) CUDA build will be used by base image.
  run:
    - "pip install --upgrade torch torchvision torchaudio"

predict: "predict.py:Predictor"
