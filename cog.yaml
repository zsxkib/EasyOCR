# Clean Screenshot OCR with EasyOCR
# Production-ready Cog deployment

build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  
  system_packages:
    - "libgl1-mesa-glx"
    - "libglib2.0-0" 
    - "libsm6"
    - "libxext6"
    - "libxrender-dev"
    - "libgomp1"
    - "libjpeg-dev"
    - "libpng-dev"
    - "libwebp-dev"
  
  python_requirements: requirements.txt
  
  # Pre-download models for faster cold starts
  run:
    - "python -c 'import easyocr; easyocr.Reader([\"en\"], gpu=False)'"
    - "python -c 'import easyocr; easyocr.Reader([\"es\", \"fr\", \"de\"], gpu=False)'"

predict: "predict.py:Predictor"
